<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学生图鉴">
<meta name="theme-color" content="#eef3fa">
<meta name="format-detection" content="telephone=no">
<title>蔚蓝档案 · 学生图鉴</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="boot" style="position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#eef3fa;gap:14px">
    <div style="width:54px;height:54px;border-radius:50%;border:3px solid rgba(59,123,250,.18);border-top-color:#3b7bfa;animation:spin .9s linear infinite"></div>
    <div style="font-size:13px;color:#6b7c95;font-weight:600;letter-spacing:.08em">STUDENT DEX</div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>

  <header id="topbar" class="topbar"></header>
  <main id="view" class="view"></main>
  <nav id="tabbar" class="tabbar"></nav>
  <div id="detail" class="detail"></div>
  <div id="sheet" class="sheet-root" hidden></div>

  <script src="data.js"></script>
  <script src="parser-core.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
