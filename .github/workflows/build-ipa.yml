name: Build unsigned IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS 14 runners were retired by GitHub on 2026-11-02.
    # Use macos-15 (or macos-latest) from now on.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check bundled resources
        run: |
          test -f StudentDex/Resources/Web/index.html
          test -f StudentDex/Resources/Web/data.js
          du -sh StudentDex/Resources/Web
          echo "OK"

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: StudentDex
        run: xcodegen generate && ls -d StudentDex.xcodeproj

      - name: Build app (unsigned)
        working-directory: StudentDex
        run: |
          set -o pipefail
          xcodebuild \
            -project StudentDex.xcodeproj \
            -scheme StudentDex \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee /tmp/build.log | tail -n 60

      - name: Package IPA
        working-directory: StudentDex
        run: |
          APP=build/Build/Products/Release-iphoneos/StudentDex.app
          if [ ! -d "$APP" ]; then echo "app not found"; find build -name "*.app" || true; exit 1; fi
          rm -rf Payload StudentDex.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry StudentDex.ipa Payload
          ls -lh StudentDex.ipa
          unzip -l StudentDex.ipa | head -n 15

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StudentDex-unsigned-ipa
          path: StudentDex/StudentDex.ipa
          if-no-files-found: error
          retention-days: 30

      # 打 tag（v1.0.0 这类）时，直接把 ipa 挂到 GitHub Release 上，
      # 这样其他用户无需登录 GitHub 就能下载。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 什亭之匣 ${{ github.ref_name }}
          body: |
            ## 什亭之匣 ${{ github.ref_name }}

            蔚蓝档案学生图鉴（281 名实装学生 / 离线可用 / 启动自动同步新学生）。

            **下载 `StudentDex.ipa` 后需要自签才能安装**，教程见仓库根目录
            [`什亭之匣iOS自签安装教程.md`](https://github.com/${{ github.repository }}/blob/main/什亭之匣iOS自签安装教程.md)。
          files: StudentDex/StudentDex.ipa
          fail_on_unmatched_files: true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7
