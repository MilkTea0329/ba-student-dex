name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS 14 runners were retired by GitHub on 2026-11-02.
    # Use macos-15 (or macos-latest) from now on.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check bundled resources
        run: |
          test -f StudentDex/Resources/Web/index.html
          test -f StudentDex/Resources/Web/data.js
          du -sh StudentDex/Resources/Web
          echo "OK"

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: StudentDex
        run: xcodegen generate && ls -d StudentDex.xcodeproj

      - name: Build app (unsigned)
        working-directory: StudentDex
        run: |
          set -o pipefail
          xcodebuild \
            -project StudentDex.xcodeproj \
            -scheme StudentDex \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee /tmp/build.log | tail -n 60

      - name: Package IPA
        working-directory: StudentDex
        run: |
          APP=build/Build/Products/Release-iphoneos/StudentDex.app
          if [ ! -d "$APP" ]; then echo "app not found"; find build -name "*.app" || true; exit 1; fi
          rm -rf Payload StudentDex.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry StudentDex.ipa Payload
          ls -lh StudentDex.ipa
          unzip -l StudentDex.ipa | head -n 15

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StudentDex-unsigned-ipa
          path: StudentDex/StudentDex.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7
